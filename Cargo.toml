[package]
name = "discord-bot-rust"
version = "0.1.1"
edition = "2021"

[features]
default = [
  "commands",
]
full = [
  "commands",
  "db_interface",
  "message_logs",
  "auto_moderation",
  "tickets",
]
commands = []
message_logs = []
auto_moderation = []
db_interface = []
tickets = []
debug = []

[dependencies.serenity]
default-features = false
features = ["full"]
version = "0.12.5"

[dependencies.uuid]
version = "1.23.4"
features = [
    "v4",                # Lets you generate random UUIDs
    "fast-rng",          # Use a faster (but still sufficiently random) RNG
    "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
]

[dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
rusqlite = "0.39.0"
anyhow = "1.0.103"
regex = "1.12.4"
nonempty = "0.12.0"
lazy_static = "1.5.0"
once_cell = "1.21.4"
strum = "0.28.0"
strum_macros = "0.28.0"
colored = "3.1.1"
chrono = "0.4.45"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
difference = "2.0.0"
futures = "0.3.32"
rand = "0.10.1"
cached = { version = "0.56.0", features = ["async"] }
idna = "1.1.0"
ring = "0.17.14"
